name: Frontend CI

# Pipeline de integración: corre en staging y main (push) y en PRs hacia ambas.
# El deploy al VPS vive en deploy-frontend.yml y está gateado a main.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

  build:
    name: Build (vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .env con placeholders: VITE_* se embeben en el bundle y la ausencia no
      # rompe la compilación; los reales solo importan en el deploy (deploy-frontend.yml).
      - name: Create .env placeholders
        run: |
          echo "VITE_API_URL=" > .env
          echo "VITE_MODE=" >> .env

      - name: Build project
        run: pnpm run build

      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  e2e:
    name: E2E tests (report-only, suite necesita mock-backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # TODO(hard-gate): ~60% de la suite depende de un backend real (VITE_API_URL);
    # en CI no hay servicio SQL Server. Pendiente: arnes de mock API (page.route
    # global) o backend de servicio, y baselines de screenshots visuales.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (with system deps)
        run: pnpm exec playwright install --with-deps chromium

      # Solo chromium en CI: la matriz completa (firefox/webkit/móviles) queda
      # para corridas locales; mantiene el pipeline en ~5 min.
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  lint:
    name: Lint (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true   # TODO(hard-gate): main arrastra ~400 errores históricos;
                              # limpieza en curso — endurecer cuando llegue a 0.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
